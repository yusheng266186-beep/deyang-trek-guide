<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f2e9">
<title>继续打开地图 · 慢慢同行</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f2e9;color:#254534;font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}header{padding:19px 22px;border-bottom:1px solid #e4e8dc;font-weight:700;letter-spacing:.08em}header span{display:inline-grid;place-items:center;width:36px;height:36px;margin-right:10px;border-radius:10px;background:#31533f;color:white}main{max-width:520px;margin:36px auto;padding:0 20px}.card{padding:28px 24px;border:1px solid #dce5da;border-radius:20px;background:#fcfcf6;box-shadow:0 14px 42px #1f47300d}.eyebrow{font-size:10px;font-weight:700;letter-spacing:.18em;color:#a28a5f}h1{margin:12px 0;font-size:25px;font-family:Georgia,"Songti SC",serif;font-weight:500}p{font-size:14px;line-height:1.8;color:#718477}.destination{padding:12px 14px;border-radius:9px;background:#edf3e9;color:#385a43}.steps{margin:20px 0;padding:0;list-style:none}.steps li{display:flex;gap:12px;padding:10px 0;font-size:14px;line-height:1.7}.steps b{display:grid;place-items:center;flex:none;width:25px;height:25px;border-radius:50%;background:#e3ece0;color:#31533f}.action,.secondary{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:10px;border-radius:10px;font-size:14px;font-weight:700;text-decoration:none;cursor:pointer}.action{background:#31533f;color:#fff;border:1px solid #31533f}.secondary{width:100%;background:transparent;color:#536f5a;border:1px solid #d8e3d6}.back{display:block;margin-top:22px;text-align:center;color:#839186;font-size:13px;text-decoration:none}.notice{font-size:12px;color:#8a9a8a}.fallback{width:100%;margin-top:8px;padding:10px;border:1px solid #dce5da;border-radius:8px;color:#526f58}[hidden]{display:none!important}
</style>
</head>
<body>
<header><span>旌</span>慢慢同行</header>
<main><section class="card">
<p class="eyebrow">OPEN IN MAPS</p><h1 id="title">在浏览器打开高德</h1><p class="destination" id="destination" hidden></p>
<div id="inside" hidden><p>微信可能拦截直接跳转，按下面两步继续：</p><ol class="steps"><li><b>1</b><span>点微信右上角 <strong>「···」</strong>，选择 <strong>「在浏览器打开」</strong>。</span></li><li><b>2</b><span>浏览器打开本页后，点 <strong>「打开高德 App」</strong>，已选的地点或路线会随链接带过去。</span></li></ol><button type="button" class="secondary" id="copy-page">找不到菜单？复制本页链接</button><input class="fallback" id="copy-field" readonly hidden aria-label="长按复制本页链接"><p class="notice" id="copy-status" role="status"></p></div>
<div id="outside" hidden><p id="outside-tip">请确认手机已安装高德地图，然后点击下方按钮。</p><a class="action" id="launch">尝试打开高德 App ↗</a><a class="secondary" id="launch-alt" hidden>没有打开？试另一种 App 打开方式 ↗</a><button type="button" class="secondary" id="copy-name" hidden>复制目的地，在高德 App 中搜索</button><a class="secondary" id="web">在高德网页查看 ↗</a><input class="fallback" id="name-field" readonly hidden aria-label="长按复制目的地名称"><p class="notice" id="name-status" role="status">如浏览器询问是否打开高德，请选择允许；不同手机浏览器对跳转的支持可能不同。</p></div>
<div id="invalid" hidden><p>这条地图链接不完整，请返回攻略重新选择地点。</p></div>
</section><a class="back" href="./#map">← 返回旅行攻略</a></main>
<script>
(()=>{'use strict';const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);let target,native;
try{target=new URL(params.get('target'));if(target.protocol!=='https:'||!/(^|\.)amap\.com$/i.test(target.hostname)||!/^\/(navigation|search|marker|place(?:\/|$)|ssr\/(?:place|dir))/i.test(target.pathname))throw Error('invalid');}catch(_){$('#invalid').hidden=false;return;}
try{native=new URL(params.get('native'));if(!((native.protocol==='amapuri:'&&((native.hostname==='route'&&native.pathname.startsWith('/plan'))||(native.hostname==='poi'&&native.pathname==='/detail')))||(native.protocol==='androidamap:'&&['route','poi'].includes(native.hostname))||(native.protocol==='iosamap:'&&['path','poi'].includes(native.hostname))))native=null;}catch(_){native=null;}
const name=params.get('name');if(name){$('#destination').textContent=`目的地：${name}`;$('#destination').hidden=false;}
const wechat=/MicroMessenger/i.test(navigator.userAgent);$('#inside').hidden=!wechat;$('#outside').hidden=wechat;
if(!wechat){$('#title').textContent='继续前往高德';const android=/Android/i.test(navigator.userAgent);if(native&&android){$('#launch').href=`intent://${native.hostname}${native.pathname}${native.search}#Intent;scheme=${native.protocol.slice(0,-1)};package=com.autonavi.minimap;end`;$('#launch-alt').href=native.href;$('#launch-alt').hidden=false;}else if(native&&/iPhone|iPad|iPod/i.test(navigator.userAgent)&&native.protocol==='iosamap:')$('#launch').href=native.href;else{$('#launch').hidden=true;$('#outside-tip').textContent='地点坐标尚未确认，请使用高德网页查看或在 App 中搜索。';}$('#copy-name').hidden=!name;$('#web').href=target.href;}
$('#copy-name').addEventListener('click',async()=>{const field=$('#name-field'),message=$('#name-status');try{await navigator.clipboard.writeText(name);message.textContent='已复制，请打开高德 App 粘贴搜索。';}catch(_){field.value=name;field.hidden=false;field.focus();field.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}message.textContent=ok?'已复制，请打开高德 App 粘贴搜索。':'请长按上方地点名称复制，再到高德 App 搜索。';}});
$('#copy-page').addEventListener('click',async()=>{const field=$('#copy-field'),message=$('#copy-status');try{await navigator.clipboard.writeText(location.href);message.textContent='已复制，请粘贴到手机浏览器打开。';}catch(_){field.value=location.href;field.hidden=false;field.focus();field.select();let ok=false;try{ok=document.execCommand('copy');}catch(_){}message.textContent=ok?'已复制，请粘贴到手机浏览器打开。':'请长按上方链接复制到手机浏览器。';}});
})();
</script>
</body></html>
